name: AI 日知 · 每日更新与周精选
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * 0'
permissions:
  contents: write
concurrency:
  group: ai-daily-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 收集公开资讯与论文
        id: collection
        run: node run.mjs
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 缓存公开翻译模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: opus-en-zh-408d9bc-v1
      - name: 安装摘要翻译依赖
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.6 sentencepiece==0.2.1 sacremoses==0.1.1
      - name: 将算法摘要翻译为中文（保留原标题）
        run: python translate-algorithms.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: 保存每日内容与周报
        if: always() && steps.collection.outcome == 'success'
        run: |
          git config user.name 'AI Daily Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI daily digest and weekly picks'
            git push
          fi
