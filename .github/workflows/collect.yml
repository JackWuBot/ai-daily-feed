name: AI 日知 · 每日更新与周精选
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * 0'
permissions:
  contents: write
concurrency:
  group: ai-daily-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 收集公开资讯与论文
        run: node run.mjs
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: 保存每日内容与周报
        run: |
          git config user.name 'AI Daily Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI daily digest and weekly picks'
            git push
          fi
